# MCDATA configuration.

# Push the MCDATA resource pack (core shaders + post effects) to players when they join.
# Minecraft does not carry packs over its own protocol: the server sends a URL and a SHA-1,
# and the client fetches the zip over HTTP.
resource-pack: true

# Serve the pack from a tiny HTTP server inside the plugin (default). resource-pack-port must
# be reachable BY PLAYERS, and it is NOT the game port: a closed port ends in "Connection
# refused" on the client and nobody gets the pack.
resource-pack-selfhost: true
resource-pack-port: 8098

# With resource-pack-selfhost: false, the URL of a pack.zip hosted elsewhere.
resource-pack-url: ""

# Kick players who decline the pack. Leave off until players actually receive it.
resource-pack-required: false

# Message shown in the client's pack prompt. Empty = vanilla wording.
resource-pack-prompt: ""

# Tick rate (per second) at which the beacon channel sends data to players.
# 20 = every server tick.
channel-rate: 20

# Path to the mcmm native binary (auto-extracted from the jar if empty).
mcmm-path: ""

# Path to the vanilla map palette JSON (auto-extracted from the jar if empty).
palette-path: ""

# Default FPS for video playback.
video-fps: 20
